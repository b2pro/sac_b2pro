# Server block do SAC para o nginx NATIVO do host.
#
# Instalar:
#   sudo cp ops/nginx/sac.conf /etc/nginx/sites-available/sac.conf
#   sudo ln -s /etc/nginx/sites-available/sac.conf /etc/nginx/sites-enabled/sac.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois, o TLS:
#   sudo certbot --nginx -d solucionix.com.br
#
# Este arquivo escuta APENAS na porta 80 de proposito. O certbot acrescenta o
# bloco 443, as diretivas ssl_certificate e o redirect 80->443, e recarrega o
# nginx. Entregar aqui um bloco 443 apontando para certificados que ainda nao
# existem faria o `nginx -t` falhar e o nginx se recusar a recarregar -- o que
# derrubaria tambem os outros sites que esta maquina serve.

server {
    listen 80;
    listen [::]:80;
    server_name solucionix.com.br;

    # Onde o compose de producao publica o container web (SAC_WEB_PORT).
    # A porta fica no loopback: quem expoe na internet e este nginx.
    set $sac_upstream http://127.0.0.1:52010;

    # IP real do visitante quando o dominio esta atras da Cloudflare.
    #
    # Sem isto, $remote_addr e o IP de uma borda da Cloudflare -- algumas dezenas
    # de enderecos compartilhados por todo mundo. Como o X-Forwarded-For abaixo e
    # montado a partir de $remote_addr, e o limitador de login le o primeiro item
    # dele, o limite de tentativas passaria a ser contado por borda da Cloudflare
    # em vez de por visitante: um teto quase global, que deixa de limitar o
    # atacante individual. Nada da erro, so protege menos.
    #
    # O include usa curinga de proposito: `include` de arquivo inexistente e erro
    # fatal no nginx, e este arquivo derruba TODOS os sites da maquina se falhar.
    # Com curinga, ausencia do snippet e ignorada e o site sobe sem o realip.
    #
    # Gerar o snippet na VPS (as faixas mudam; sempre da fonte da Cloudflare):
    #
    #   sudo mkdir -p /etc/nginx/snippets
    #   { curl -s https://www.cloudflare.com/ips-v4; curl -s https://www.cloudflare.com/ips-v6; } \
    #     | sed 's|^|set_real_ip_from |; s|$|;|' \
    #     | sudo tee /etc/nginx/snippets/cloudflare-realip.conf > /dev/null
    #   echo 'real_ip_header CF-Connecting-IP;' \
    #     | sudo tee -a /etc/nginx/snippets/cloudflare-realip.conf > /dev/null
    #   sudo nginx -t && sudo systemctl reload nginx
    #
    # Se o dominio sair de tras da Cloudflare, apague o snippet: confiar em
    # CF-Connecting-IP sem a Cloudflare na frente deixaria qualquer cliente
    # mandar esse header e forjar o proprio IP.
    include /etc/nginx/snippets/cloudflare-realip*.conf;

    # Stream de notificacoes (SSE). Precisa vir separado: com proxy_buffering
    # ligado o nginx segura os eventos e as notificacoes param de chegar, sem
    # erro em lugar nenhum. Os dois saltos de proxy (este e o do container)
    # precisam estar sem buffer.
    location = /api/notificacoes/stream {
        proxy_pass $sac_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SOBRESCREVE o header, nao acrescenta. O limitador de login le o
        # PRIMEIRO item de X-Forwarded-For: com $proxy_add_x_forwarded_for aqui,
        # um cliente que mande "X-Forwarded-For: 1.2.3.4" viraria o primeiro
        # item e falsificaria o proprio IP, escapando do limite de tentativas.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $sac_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
