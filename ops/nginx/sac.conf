# Server block do SAC para o nginx NATIVO do host.
#
# Instalar:
#   sudo cp ops/nginx/sac.conf /etc/nginx/sites-available/sac.conf
#   sudo ln -s /etc/nginx/sites-available/sac.conf /etc/nginx/sites-enabled/sac.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois, o TLS:
#   sudo certbot --nginx -d solucionix.com.br
#
# Este arquivo escuta APENAS na porta 80 de proposito. O certbot acrescenta o
# bloco 443, as diretivas ssl_certificate e o redirect 80->443, e recarrega o
# nginx. Entregar aqui um bloco 443 apontando para certificados que ainda nao
# existem faria o `nginx -t` falhar e o nginx se recusar a recarregar -- o que
# derrubaria tambem os outros sites que esta maquina serve.

server {
    listen 80;
    listen [::]:80;
    server_name solucionix.com.br;

    # Onde o compose de producao publica o container web (SAC_WEB_PORT).
    # A porta fica no loopback: quem expoe na internet e este nginx.
    set $sac_upstream http://127.0.0.1:52010;

    # Stream de notificacoes (SSE). Precisa vir separado: com proxy_buffering
    # ligado o nginx segura os eventos e as notificacoes param de chegar, sem
    # erro em lugar nenhum. Os dois saltos de proxy (este e o do container)
    # precisam estar sem buffer.
    location = /api/notificacoes/stream {
        proxy_pass $sac_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SOBRESCREVE o header, nao acrescenta. O limitador de login le o
        # PRIMEIRO item de X-Forwarded-For: com $proxy_add_x_forwarded_for aqui,
        # um cliente que mande "X-Forwarded-For: 1.2.3.4" viraria o primeiro
        # item e falsificaria o proprio IP, escapando do limite de tentativas.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $sac_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
